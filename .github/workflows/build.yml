---
name: Build and publish chrony-ntp-server image

on:
  push:
    branches:
      - main
    paths:
      - "image/**"
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to OCI tarball
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=image.tar \
            ./image

      - name: Upload OCI tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar
          retention-days: 1

  check:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.digest.outputs.changed }}
      new_digest: ${{ steps.digest.outputs.new }}

    steps:
      - name: Download OCI tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar

      - name: Compute and compare content digest
        id: digest
        run: |
          NEW_DIGEST=$(sha256sum image.tar | awk '{print $1}')
          OLD_DIGEST="${{ vars.IMAGE_DIGEST }}"
          echo "new=$NEW_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Previous digest: ${OLD_DIGEST:-none}"
          echo "New digest:      $NEW_DIGEST"
          if [ "$NEW_DIGEST" != "$OLD_DIGEST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [build, check]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # to update the IMAGE_DIGEST repo variable
      packages: write  # to push to GHCR

    steps:
      - name: Download OCI tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Push to GHCR
        run: |
          skopeo copy \
            --multi-arch all \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            oci-archive:image.tar \
            docker://ghcr.io/clbsoldev/chrony-ntp-server:latest

      - name: Push to Docker Hub
        if: vars.ENABLE_DOCKERHUB == 'true'
        run: |
          skopeo copy \
            --multi-arch all \
            --dest-creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
            oci-archive:image.tar \
            docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/chrony-ntp-server:latest

      - name: Sync README to Docker Hub
        if: vars.ENABLE_DOCKERHUB == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/chrony-ntp-server
          readme-filepath: ./README.md
          short-description: "Rootless Chrony NTP server with full custom chrony.conf support (Cisco Secure NTP compatible)"

      - name: Update IMAGE_DIGEST repo variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set IMAGE_DIGEST \
            --repo "${{ github.repository }}" \
            --body "${{ needs.check.outputs.new_digest }}"
